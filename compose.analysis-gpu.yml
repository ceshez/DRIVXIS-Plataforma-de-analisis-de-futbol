name: drivxis-analysis

services:
  worker-h100:
    build:
      context: .
      dockerfile: Dockerfile.analysis-gpu
    image: drivxis-analysis-worker:locateanything-h100
    restart: unless-stopped
    init: true
    shm_size: "32gb"
    env_file:
      - ${ANALYSIS_ENV_FILE:-./deploy/analysis-gpu.env}
    environment:
      ANALYSIS_AUTO_START: "false"
      ANALYSIS_DETECTOR: "locateanything"
      ANALYSIS_REQUIRED_GPU_NAME: "H100"
      HF_HOME: /models/huggingface
      LOCAL_STORAGE_ROOT: /work/uploads
      ANALYSIS_STORAGE_ROOT: /work/analysis
    volumes:
      - drivxis_hf_cache:/models/huggingface
      - drivxis_analysis_work:/work
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  drivxis_hf_cache:
  drivxis_analysis_work:
